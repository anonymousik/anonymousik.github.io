<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'none'; font-src 'self' data:; base-uri 'none'; form-action 'none';">
  
  <meta name="description" content="SECFERRO Live WebTerm - Mobile Optimized SecOps Terminal">
  <meta name="theme-color" content="#0d1117">
  <title>anonymousik.is-a.dev | Live WebTerm</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />

  <style>
    :root {
      --bg-color: #0d1117;
      --border-color: #30363d;
      --accent-green: #4ade80;
      --text-main: #c9d1d9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #010409;
    }

    h1 {
      font-size: 1rem;
      font-weight: bold;
    }

    .status-badge {
      font-size: 0.7rem;
      color: var(--accent-green);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.4rem;
      background: rgba(74, 222, 128, 0.05);
    }

    #terminal-container {
      flex: 1;
      width: 100%;
      padding: 8px;
      background-color: var(--bg-color);
      overflow: hidden;
      cursor: text; /* Wskazuje pole interaktywne dla urządzeń dotykowych */
    }

    .xterm-viewport::-webkit-scrollbar { width: 6px; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: var(--border-color); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
</head>
<body>

  <header>
    <h1>anonymousik<span style="color: var(--accent-green);">.is-a.dev</span></h1>
    <div class="status-badge">[MOBILE-READY SHELL]</div>
  </header>

  <div id="terminal-container"></div>

  <script>
    'use strict';

    document.addEventListener('DOMContentLoaded', () => {
      const term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 14,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
        theme: {
          background: '#0d1117',
          foreground: '#c9d1d9',
          cursor: '#4ade80',
          selectionBackground: 'rgba(74, 222, 128, 0.3)',
          black: '#0d1117',
          brightBlack: '#8b949e',
          red: '#f87171',
          brightRed: '#fca5a5',
          green: '#4ade80',
          brightGreen: '#86efac',
          yellow: '#facc15',
          brightYellow: '#fde047',
          blue: '#60a5fa',
          brightBlue: '#93c5fd',
          magenta: '#c084fc',
          cyan: '#38bdf8',
          white: '#c9d1d9',
          brightWhite: '#f8fafc'
        }
      });

      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      const container = document.getElementById('terminal-container');
      term.open(container);
      fitAddon.fit();

      window.addEventListener('resize', () => {
        fitAddon.fit();
      });

      container.addEventListener('click', () => {
        term.focus();
      });

      term.writeln('\x1b[1;32m[+] Środowisko WebTerm (Mobile Fixed) aktywne.\x1b[0m');
      term.writeln('Wpisz \x1b[1;36mhelp\x1b[0m, aby wyświetlić listę poleceń.\x1b[0m');
      term.write('\r\n\x1b[1;32mSECFERRO@anonymousik\x1b[0m:\x1b[1;34m~\x1b[0m$ ');

      let currentCommand = '';
      term.onData(data => {
        const code = data.charCodeAt(0);

        if (code === 13) {
          term.write('\r\n');
          processCommand(currentCommand.trim());
          currentCommand = '';
          term.write('\x1b[1;32mSECFERRO@anonymousik\x1b[0m:\x1b[1;34m~\x1b[0m$ ');
        } else if (code === 127 || code === 8) {
          if (currentCommand.length > 0) {
            currentCommand = currentCommand.slice(0, -1);
            term.write('\b \b');
          }
        } else if (code < 32) {
          return;
        } else {
          currentCommand += data;
          term.write(data);
        }
      });

      function processCommand(cmd) {
        const lowerCmd = cmd.toLowerCase();
        
        if (lowerCmd === 'help') {
          term.writeln('Dostępne polecenia systemowe:');
          term.writeln('  \x1b[1;36mwhoami\x1b[0m     - Tożsamość sesji');
          term.writeln('  \x1b[1;36muname -a\x1b[0m   - Informacje o jądrze');
          term.writeln('  \x1b[1;36mprojects\x1b[0m   - Lista projektów');
          term.writeln('  \x1b[1;36mclear\x1b[0m      - Wyczyść ekran terminala');
        } else if (lowerCmd === 'whoami') {
          term.writeln('Ferro (Krzysztof) - Ekspert SecOps & Reverse Engineering');
        } else if (lowerCmd === 'uname -a' || lowerCmd === 'uname') {
          term.writeln('Linux anonymousik-secops 6.8.0-arch1-1 #1 SMP PREEMPT SecOps x86_64 GNU/Linux');
        } else if (lowerCmd === 'projects') {
          term.writeln(' -> WebTerm SSH [Node.js / SecOps]');
          term.writeln(' -> HackLab Scripts [Python / Bash / ADB]');
        } else if (lowerCmd === 'clear') {
          term.clear();
        } else if (cmd !== '') {
          term.writeln(`\x1b[1;31mbash: polecenie nieznane: ${cmd}\x1b[0m`);
        }
      }

      setTimeout(() => {
        term.focus();
      }, 150);
    });
  </script>
</body>
</html>
