name: "ANONYMOUSIK-WEB-ENV"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Najważniejsza praktyka bezpieczeństwa: jawne ograniczenie uprawnień GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Zapobieganie konfliktom wdrożeń (anuluje starsze, trwające budowania)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Przykład dla Node.js (Vite / Next / Astro itp.) – jeśli używasz
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatyczny cache dla szybszego budowania

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      # Bezpieczne pakowanie wygenerowanego katalogu produkcyjnego (np. dist, build, public)
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      # Bezpośrednie wdrożenie bez użycia dodatkowych gałęzi git
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
