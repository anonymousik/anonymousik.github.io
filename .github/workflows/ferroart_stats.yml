name: FerroART-STATS-GRABBER(YT-Cheelee-Tiktok)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 20 * * *' 
# Synchronizacja statystyk codziennie o godz 20:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie gałęzi głównej
        uses: actions/checkout@v3

      - name: Konfiguracja środowiska Node.js (Wsparcie dla v20+)
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Instalacja zależności systemowych i NPM
        run: npm ci

      - name: Instalacja silnika Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Wykonanie skryptu zbierania statystyk (Scraper)
        run: node scripts/generate-stats.js

      - name: Kompilacja aplikacji statycznej (Vite)
        run: npm run build

      - name: Utworzenie pliku .nojekyll dla GitHub Pages
        run: touch dist/.nojekyll

      - name: Wdrożenie na gałąź produkcyjną gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: scripts
          commit_message: "Automatyczna synchronizacja statystyk SecFerro 🛡️"

      - name: Git commit & push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add scripts/stats.json
          git commit -m "🤖 Update stats.json" || echo "No changes"
          git push origin main