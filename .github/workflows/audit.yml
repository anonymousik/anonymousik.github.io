name: "ANONYMOUSIK.IS-A.DEV-CYBERSEC-AUDIT-HEADER"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write      
  pages: write         
  id-token: write      

concurrency:
  group: "pages-audit"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:  
      - name: "ANONYMOUSIK.IS-A.DEV / KONTROLA CHECKOUT"
        uses: actions/checkout@v4

      - name: "ANONYMOUSIK.IS-A.DEV / KONFIGURACJA PYTHON"
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'       
          cache: 'pip'

      - name: "Instalacja zależności"
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: "ANONYMOUSIK.IS-A.DEV / KONTROLA BEZPIECZEŃSTWA"
        run: python security_audit.py
      - name: "Uruchomienie Snyk CLI (Skanowanie podatności)"
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
      - name: "Konfiguracja środowiska GitHub Pages"
        uses: actions/configure-pages@v6.0.0
      - name: "Pakowanie raportu i strony (Artefakt)"
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: "ANONYMOUSIK.IS-A.DEV / WDRAŻANIE BEZPOŚREDNIE"
        id: deployment
        uses: actions/deploy-pages@v4
